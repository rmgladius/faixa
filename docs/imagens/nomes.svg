<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="t d" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">Nome de música, não de vídeo</title>
  <desc id="d">Exemplos de títulos do YouTube e do nome de arquivo que o Faixa gera: sai o que descreve o vídeo, como Clipe Oficial, 4K, Visualizer e hashtags, e artista e música ficam na ordem certa.</desc>
  <rect width="960" height="400" rx="24" fill="#0B0C10"/>
  <text x="40" y="48" font-size="15" fill="#9AA3B2">Título no YouTube</text>
  <text x="560" y="48" font-size="15" fill="#9AA3B2">Arquivo salvo</text>
  <line x1="40" y1="72" x2="920" y2="72" stroke="#1E2129" stroke-width="1"/>
  <text x="40" y="124" font-family="Cascadia Mono, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="15"><tspan fill="#9AA3B2">Maré Alta - Luz de Cinema </tspan><tspan fill="#FF6A3D" fill-opacity="0.75" text-decoration="line-through">(Clipe Oficial) [4K]</tspan></text><text x="526" y="124" font-size="18" fill="#6B7280">→</text><text x="560" y="124" font-family="Cascadia Mono, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#F2F4F8">Maré Alta - Luz de Cinema<tspan fill="#6B7280">.mp3</tspan></text><line x1="40" y1="162" x2="920" y2="162" stroke="#1E2129" stroke-width="1"/><text x="40" y="192" font-family="Cascadia Mono, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="15"><tspan fill="#9AA3B2">Céu de Agosto - Coletivo Ventania</tspan></text><text x="526" y="192" font-size="18" fill="#6B7280">→</text><text x="560" y="192" font-family="Cascadia Mono, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#F2F4F8">Coletivo Ventania - Céu de Agosto<tspan fill="#6B7280">.mp3</tspan></text><text x="560" y="214" font-size="12.5" fill="#6B7280">o canal diz quem é o artista</text><line x1="40" y1="230" x2="920" y2="230" stroke="#1E2129" stroke-width="1"/><text x="40" y="260" font-family="Cascadia Mono, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="15"><tspan fill="#9AA3B2">Lia Brandão &quot;Varanda&quot; </tspan><tspan fill="#FF6A3D" fill-opacity="0.75" text-decoration="line-through">(Visualizer)</tspan></text><text x="526" y="260" font-size="18" fill="#6B7280">→</text><text x="560" y="260" font-family="Cascadia Mono, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#F2F4F8">Lia Brandão - Varanda<tspan fill="#6B7280">.mp3</tspan></text><text x="560" y="282" font-size="12.5" fill="#6B7280">aspas também separam</text><line x1="40" y1="298" x2="920" y2="298" stroke="#1E2129" stroke-width="1"/><text x="40" y="328" font-family="Cascadia Mono, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="15"><tspan fill="#9AA3B2">Duo Pitanga - Café Frio </tspan><tspan fill="#FF6A3D" fill-opacity="0.75" text-decoration="line-through">(Official Audio) #mpb</tspan></text><text x="526" y="328" font-size="18" fill="#6B7280">→</text><text x="560" y="328" font-family="Cascadia Mono, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#F2F4F8">Duo Pitanga - Café Frio<tspan fill="#6B7280">.mp3</tspan></text><line x1="40" y1="366" x2="920" y2="366" stroke="#1E2129" stroke-width="1"/>
