<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="t d" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">O teto é a fonte</title>
  <desc id="d">Um vídeo com áudio Opus de 141 kbps no YouTube. Salvo como original, fica com os mesmos 141 kbps. Convertido para MP3 de 320 kbps, o arquivo cresce mas não ganha detalhe acima de 141. Em MP3 de 128 kbps, perde um pouco.</desc>
