<svg xmlns="http://www.w3.org/2000/svg" width="960" height="254" viewBox="0 0 960 254" role="img" aria-labelledby="t" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">Caminho de um download no Faixa: link, prévia, análise, download e arquivo</title>
  <rect width="960" height="254" rx="24" fill="#0B0C10"/>
  <rect x="40" y="40" width="152" height="150" rx="14" fill="#171A21"/><text x="58" y="70" font-size="12" font-weight="700" fill="#FF6A3D">01</text><text x="58" y="98" font-size="17" font-weight="600" fill="#F2F4F8">Link</text><text x="58" y="126" font-size="13" fill="#9AA3B2">vídeo, playlist</text><text x="58" y="145" font-size="13" fill="#9AA3B2">ou álbum do</text><text x="58" y="164" font-size="13" fill="#9AA3B2">YouTube Music</text><path d="M199 115.0 h16 m-5 -5 l5 5 l-5 5" fill="none" stroke="#4A505C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="222" y="40" width="152" height="150" rx="14" fill="#171A21"/><text x="240" y="70" font-size="12" font-weight="700" fill="#FF6A3D">02</text><text x="240" y="98" font-size="17" font-weight="600" fill="#F2F4F8">Prévia</text><text x="240" y="126" font-size="13" fill="#9AA3B2">capa e título</text><text x="240" y="145" font-size="13" fill="#9AA3B2">pelo oEmbed,</text><text x="240" y="164" font-size="13" fill="#9AA3B2">em menos de 1 s</text><path d="M381 115.0 h16 m-5 -5 l5 5 l-5 5" fill="none" stroke="#4A505C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="404" y="40" width="152" height="150" rx="14" fill="#171A21"/><text x="422" y="70" font-size="12" font-weight="700" fill="#FF6A3D">03</text><text x="422" y="98" font-size="17" font-weight="600" fill="#F2F4F8">Análise</text><text x="422" y="126" font-size="13" fill="#9AA3B2">yt-dlp -J lista</text><text x="422" y="145" font-size="13" fill="#9AA3B2">os formatos de</text><text x="422" y="164" font-size="13" fill="#9AA3B2">áudio reais</text><path d="M563 115.0 h16 m-5 -5 l5 5 l-5 5" fill="none" stroke="#4A505C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="586" y="40" width="152" height="150" rx="14" fill="#171A21"/><text x="604" y="70" font-size="12" font-weight="700" fill="#FF6A3D">04</text><text x="604" y="98" font-size="17" font-weight="600" fill="#F2F4F8">Download</text><text x="604" y="126" font-size="13" fill="#9AA3B2">pede o formato</text><text x="604" y="145" font-size="13" fill="#9AA3B2">exato; FFmpeg</text><text x="604" y="164" font-size="13" fill="#9AA3B2">converte o MP3</text><path d="M745 115.0 h16 m-5 -5 l5 5 l-5 5" fill="none" stroke="#4A505C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="768" y="40" width="152" height="150" rx="14" fill="#171A21"/><text x="786" y="70" font-size="12" font-weight="700" fill="#FF6A3D">05</text><text x="786" y="98" font-size="17" font-weight="600" fill="#F2F4F8">Arquivo</text><text x="786" y="126" font-size="13" fill="#9AA3B2">nome limpo, tags</text><text x="786" y="145" font-size="13" fill="#9AA3B2">ID3v2.3, entregue</text><text x="786" y="164" font-size="13" fill="#9AA3B2">na pasta</text>
  <text x="40" y="230" font-size="13" fill="#6B7280">Na primeira abertura o Faixa baixa sozinho o yt-dlp, o FFmpeg e o Deno (cerca de 160 MB).</text>
